name: Deploy portfolio to Github Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html about.html skills.html Projects.html contact.html _site/
          cp DevanshResume_AI_ML_DevOps.pdf _site/
          cp -r css js _site/
          mkdir -p _site/img
          cp -r img/projects img/dev-cutout.webp img/dev-portrait.webp _site/img/

      - name: Check every local link resolves
        run: |
          cd _site
          grep -oE '(src|href)="[^"#:]+"' index.html \
            | sed -E 's/^(src|href)="//; s/"$//; s/\?.*$//' \
            | sort -u | while read -r f; do
                [ -e "$f" ] || { echo "Missing file: $f"; exit 1; }
              done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 
